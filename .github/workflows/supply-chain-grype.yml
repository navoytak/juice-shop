name: Supply Chain Security

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1. Install dependencies so node_modules exists
      - name: Install Dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      # 2. Install Syft and Grype CLIs directly (bypasses GitHub Action wrapper bugs)
      - name: Install Syft and Grype CLIs
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # 3. Generate SBOM using explicit shell redirection
      - name: Generate Full SBOM
        run: |
          syft dir:./node_modules --exclude "" -o spdx-json > juiceshop.sbom.spdx.json
          ls -lh juiceshop.sbom.spdx.json

      # 4. Upload the confirmed file as an artifact
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juiceshop-sbom-spdx
          path: juiceshop.sbom.spdx.json

      # 5. Scan the SBOM with Grype and upload findings to GitHub Security
      - name: Scan SBOM with Grype
        run: grype sbom:juiceshop.sbom.spdx.json -o sarif > results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: "grype-sbom"

      # 6. Install GuardDog via pip and jq to scan dependency risk
      - name: Install GuardDog & jq
        run: |
          pip3 install guarddog
          sudo apt-get install -y jq
        continue-on-error: true

      - name: Run GuardDog Dependency Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Extracting dependencies from package.json..."
          DEPS=$(jq -r '(.dependencies // {}) + (.devDependencies // {}) | keys[]' package.json)

          if [ -z "$DEPS" ]; then
            echo "No dependencies found to scan."
            exit 0
          fi

          echo "Scanning dependencies with GuardDog..."
          for dep in $DEPS; do
            echo "----------------------------------------"
            echo "Scanning package: $dep"
            guarddog npm scan "$dep" \
              --exclude-rules metadata_mismatch \
              --exclude-rules potentially_compromised_email_domain \
              --exclude-rules unclaimed_maintainer_email_domain || true
          done
        continue-on-error: true
